name: Chaja

options:
  bundleIdPrefix: com.n22309002
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    # 자체 서명 인증서에는 Team ID가 없어 Hardened Runtime의 라이브러리 검증에 걸린다. 공증을 안 하므로 끈다.
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Chaja Self-Signed"
    DEVELOPMENT_TEAM: ""

targets:
  Chaja:
    type: application
    platform: macOS
    sources:
      - path: Chaja
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n22309002.Chaja
        PRODUCT_NAME: Chaja
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Chaja/Resources/Chaja.entitlements
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Chaja/Resources/Info.plist
    info:
      path: Chaja/Resources/Info.plist
      properties:
        CFBundleDisplayName: Chaja
        CFBundleName: Chaja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Chaja"
    entitlements:
      path: Chaja/Resources/Chaja.entitlements
      properties:
        com.apple.security.app-sandbox: false
