name: Chaja

options:
  bundleIdPrefix: com.n22309002
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    # 자체 서명 인증서에는 Team ID가 없어 Hardened Runtime의 라이브러리 검증에 걸린다. 공증을 안 하므로 끈다.
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Chaja Self-Signed"
    DEVELOPMENT_TEAM: ""

targets:
  Chaja:
    type: application
    platform: macOS
    sources:
      - path: Chaja
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n22309002.Chaja
        PRODUCT_NAME: Chaja
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Chaja/Resources/Chaja.entitlements
        ENABLE_APP_SANDBOX: NO
        # 비슷한 이미지 묶기에 쓰는 cblas_sgemm의 새 Accelerate 헤더 (옛 헤더는 macOS 13.3부터 deprecated)
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -DACCELERATE_NEW_LAPACK"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Chaja/Resources/Info.plist
    info:
      path: Chaja/Resources/Info.plist
      properties:
        CFBundleDisplayName: Chaja
        CFBundleName: Chaja
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Chaja"
        NSDesktopFolderUsageDescription: 데스크탑에 있는 파일을 찾아 보여주려면 접근 권한이 필요합니다.
        NSDocumentsFolderUsageDescription: 문서 폴더에 있는 파일을 찾아 보여주려면 접근 권한이 필요합니다.
        NSDownloadsFolderUsageDescription: 다운로드 폴더에 있는 파일을 찾아 보여주려면 접근 권한이 필요합니다.
        NSRemovableVolumesUsageDescription: 외장 드라이브에 있는 파일을 찾아 보여주려면 접근 권한이 필요합니다.
        NSNetworkVolumesUsageDescription: 네트워크 드라이브에 있는 파일을 찾아 보여주려면 접근 권한이 필요합니다.
    entitlements:
      path: Chaja/Resources/Chaja.entitlements
      properties:
        com.apple.security.app-sandbox: false
    scheme:
      testTargets:
        - ChajaTests

  ChajaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ChajaTests
    dependencies:
      - target: Chaja
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.n22309002.ChajaTests
